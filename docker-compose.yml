services:
  postgres:
    image: postgres:16-alpine
    container_name: dividi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dividi_dev
    ports:
      - "5432:5432"
    volumes:
      - dividi_postgres_data:/var/lib/postgresql/data

volumes:
  dividi_postgres_data:
